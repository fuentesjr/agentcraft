<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
    </title>
    <meta
      name="description"
      content="{{ page.summary | default: site.description }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="{{ '/cheatsheets/' | relative_url }}">Cheatsheets</a>
          <a href="{{ '/playbooks/' | relative_url }}">Playbooks</a>
          <a href="{{ '/guides/' | relative_url }}">Guides</a>
          <a href="{{ '/patterns/' | relative_url }}">Patterns</a>
          <a href="{{ '/templates/' | relative_url }}">Templates</a>
        </nav>
      </div>
    </header>

    <main id="content" class="wrap page">{{ content }}</main>

    <footer class="site-footer">
      <div class="wrap">
        Agentcraft is the lab notebook. The Field Guide is the curated shelf.
      </div>
    </footer>
  </body>
</html>
